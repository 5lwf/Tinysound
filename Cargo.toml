[package]
name = "tinysound"
version = "0.4.0"
edition = "2024"
license = "MIT"
description = "Lightweight SoundCloud and Spotify desktop shell using Windows WebView2"

[dependencies]
wry = { version = "0.57", default-features = false, features = ["os-webview"] }
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
windows = { version = "0.62", features = ["Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_Shell_PropertiesSystem"] }
webview2-com = "0.39"
serde_json = "1"
base64 = "0.22"
raw-window-handle = "0.6"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
